[package]
name = "qqbot-sdk-node"
version = "0.2.1"
edition = "2024"
publish = false

[dependencies]
napi = { version = "3.16.2", features = ["tokio_rt", "serde-json"] }
napi-derive = "3.7.1"
qqbot-sdk-core = { path = "../core" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "macros"] }

[build-dependencies]
napi-build = "2.6.0"

[lib]
crate-type = ["cdylib"]
