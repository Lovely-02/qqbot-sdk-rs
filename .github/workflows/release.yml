name: 🚀 统一发布

on:
  push:
    branches: [main]
    tags: [github-packages-v*]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '🏷️ 重试已有的 qqbot-sdk-rs-vX.Y.Z 标签；留空则运行 Release Please'
        required: false
        type: string
      target:
        description: '🎯 指定标签后选择需要重试的包仓库'
        required: true
        default: both
        type: choice
        options: [both, rust, npm]
      skip-core:
        description: '⏭️ 重试时跳过已经发布成功的 core crate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 📝 准备统一版本
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/github-packages-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || startsWith(github.ref, 'refs/tags/github-packages-v') }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag || (startsWith(github.ref, 'refs/tags/github-packages-v') && github.ref_name) }}
    steps:
      - name: 📝 创建统一版本 PR 与发布记录
        if: inputs.tag == '' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  check:
    name: 🔍 检查构建与版本
    runs-on: ubuntu-latest
    steps:
      - name: 📂 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 📚 安装 npm 依赖
        run: npm ci --prefix packages/npm --registry=https://registry.npmjs.org
      - name: 🔢 检查统一版本
        run: npm run check:versions --prefix packages/npm
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: 🦀 配置 Rust 工具链
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: 🔧 检查 Rust workspace 编译
        run: cargo check --workspace --all-targets --locked

  publish:
    name: 🦀 发布 Cargo 包
    needs: [check, release]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.release.outputs.release_created == 'true' ||
       (inputs.tag != '' && inputs.target != 'npm'))
    runs-on: ubuntu-latest
    steps:
      - name: 📂 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: 📚 安装 npm 依赖
        run: npm ci --prefix packages/npm --registry=https://registry.npmjs.org
      - name: 🔢 校验发布版本与标签
        run: npm run check:versions --prefix packages/npm
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      - name: 🦀 配置 Rust 工具链
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: 📤 发布共享核心 crate
        if: inputs.tag == '' || inputs.skip-core != true
        run: cargo publish -p qqbot-sdk-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
      - name: 📤 发布 Rust SDK crate
        run: cargo publish -p qqbot-sdk-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}

  npm-build:
    name: 🛠️ 构建 npm 包（${{ matrix.target }}）
    needs: release
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' ||
       (needs.release.result == 'success' &&
        (needs.release.outputs.release_created == 'true' || (inputs.tag != '' && inputs.target != 'rust'))))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: 📂 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name || github.sha }}
      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json
      - name: 🦀 配置 Rust 工具链
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: 📚 安装 npm 依赖
        run: npm ci --registry=https://registry.npmjs.org
      - name: 🛠️ 构建 npm 原生模块
        run: npm run build -- --target ${{ matrix.target }} -- --locked
      - name: 🔢 检查统一版本
        run: npm run check:versions
      - name: 🔍 检查 TypeScript 类型
        run: npm run typecheck
      - name: 🔍 检查 npm 包内容
        run: npm pack --dry-run
      - name: 📤 上传多平台构建产物
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: |
            packages/npm/*.node
            packages/npm/native.js
            packages/npm/native.d.ts
          if-no-files-found: error

  npm-publish:
    name: 📦 发布 GitHub Packages
    needs: [check, release, npm-build]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/github-packages-v')) &&
      needs['npm-build'].result == 'success' &&
      (needs.release.outputs.release_created == 'true' || (inputs.tag != '' && inputs.target != 'rust'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - name: 📂 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: ⚙️ 配置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@lovely-02'
      - name: 📚 安装 npm 依赖
        run: npm ci --registry=https://registry.npmjs.org
      - name: 📥 汇总多平台构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: packages/npm
      - name: 📦 校验版本并打包 npm 发行包
        run: |
          npm run check:versions
          npm run pack:release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
      - name: 💾 保存 npm 包构建产物
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/npm/release-packages/*.tgz
          if-no-files-found: error
      - name: 📤 发布 npm 包
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          registry=https://npm.pkg.github.com
          for archive in ./release-packages/lovely-02-qqbot-sdk-js-*"-$version.tgz"; do
            name=$(tar -xOf "$archive" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).name")
            published=$(npm view "$name@$version" version --registry="$registry") || published=''
            if [[ "$published" != "$version" ]]; then
              npm publish "$archive" --registry="$registry"
            fi
          done
          npm publish "./release-packages/lovely-02-qqbot-sdk-js-$version.tgz" --registry="$registry"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
